name: veilgate
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      POSTGRES_DB: veilgate
      PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD}
      PG_READONLY_PASSWORD: ${PG_READONLY_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veilgate"]
      interval: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 12

  kafka:
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      --node-id 0 --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://kafka:9092
    ports: ["9092:9092"]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]

  wiremock:
    image: wiremock/wiremock:3.9.1
    command: ["--verbose"]
    volumes: ["./wiremock:/home/wiremock"]
    ports: ["8089:8080"]

volumes:
  pgdata:
